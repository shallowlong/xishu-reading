# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html
## Source: https://github.com/hexojs/hexo/

# Site
title: 奚叔阅读
subtitle: 我所收集和创建的阅读内容集合
description: "奚叔阅读：我所收集和创建的阅读内容集合，收录 AI 政策洞察、AI 驱动服装电商、知乎高赞精选等系列。"
keywords: "奚叔阅读, 阅读内容集合, AI 政策洞察, AI 驱动服装电商, 知乎高赞精选"
author: 奚叔2099
language: zh-CN
timezone: "Asia/Shanghai"

# URL
url: https://reading.xishu2099.top
root: /
permalink: :year/:month/:timestamp/
permalink_defaults:
pretty_urls:
  trailing_index: true
  trailing_html: true

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
new_post_name: :year/:month/:day/:title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ""
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
syntax_highlighter: highlight.js
highlight:
  line_number: false
  auto_detect: false
  tab_replace: ""
  wrap: true
  hljs: false
prismjs:
  preprocess: false
  line_number: false
  tab_replace: ""

# Home page setting
# 首页由 index_generator 生成，主题内截取前 N 篇做排版编排
index_generator:
  path: ""
  per_page: 0
  order_by: -date

# Category & Tag
default_category: 未分类
category_map:
tag_map:

# Metadata elements
meta_generator: true

# Date / Time format
date_format: YYYY-MM-DD
time_format: HH:mm
updated_option: mtime

# Pagination（列表不分页，全部在同一页内按月分组）
per_page: 0
pagination_dir: page

# Include / Exclude file(s)
include:
exclude:
ignore:

# Extensions
theme: newspaper

# Deployment
deploy:
  type: ""
