name: 部署「奚叔阅读」到阿里云

# 推送 main 或手动触发：构建 Hexo，再用 rsync over SSH 同步到 reading.xishu2099.top
#
# 与 xishu-website 使用同一套部署方式，仓库 Secrets 需要：
#   ALIYUN_HOST     服务器 IP 或域名
#   ALIYUN_USER     SSH 用户
#   ALIYUN_SSH_KEY  SSH 私钥（PEM 全文，含 BEGIN/END 行）
#   FEISHU_WEBHOOK  选填，飞书机器人 webhook，不填则跳过通知
#
# 目标目录：/www/wwwroot/reading.xishu2099.top
# 服务器自带的 .well-known / .htaccess / .user.ini 与初始 404.html 由仓库根的
# .rsync-exclude 保护，不会被 --delete 清掉（规则文件用 LF，避免 \r 导致匹配失败）。

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v6

      - name: 设置 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "npm"

      - name: 安装依赖
        run: npm ci

      - name: 生成静态文件
        run: npm run clean && npm run build
        env:
          HEXO_ENV: production

      - name: 检查部署排除规则
        run: |
          test -f .rsync-exclude
          echo "以下路径受保护，--delete 不会删除："
          cat .rsync-exclude

      - name: 部署到阿里云
        uses: easingthemes/ssh-deploy@v2.2.6 # 与 xishu-website 保持一致，固定版本
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ALIYUN_SSH_KEY }}
          ARGS: "-avz --delete --exclude-from=.rsync-exclude"
          SOURCE: "public/"
          REMOTE_HOST: ${{ secrets.ALIYUN_HOST }}
          REMOTE_USER: ${{ secrets.ALIYUN_USER }}
          TARGET: "/www/wwwroot/reading.xishu2099.top"

      - name: 校验受保护文件仍在
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ALIYUN_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.ALIYUN_HOST }}
          REMOTE_USER: ${{ secrets.ALIYUN_USER }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=15 \
            "$REMOTE_USER@$REMOTE_HOST" '
              cd /www/wwwroot/reading.xishu2099.top || exit 1
              test -d .well-known || { echo "缺少 .well-known"; exit 1; }
              test -f .htaccess  || { echo "缺少 .htaccess"; exit 1; }
              test -f .user.ini  || { echo "缺少 .user.ini"; exit 1; }
              echo "受保护文件均存在：.well-known / .htaccess / .user.ini"
            '

      - name: 发送飞书通知（成功）
        if: success()
        continue-on-error: true
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        run: |
          if [ -z "$FEISHU_WEBHOOK" ]; then
            echo "未配置 FEISHU_WEBHOOK，跳过通知"
            exit 0
          fi
          curl -s -X POST "$FEISHU_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d '{
              "msg_type": "text",
              "content": {
                "text": "✅ xishu-reading 部署成功\n分支: ${{ github.ref_name }}\n提交: ${{ github.sha }}\n站点: https://reading.xishu2099.top"
              }
            }'

      - name: 发送飞书通知（失败）
        if: failure()
        continue-on-error: true
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        run: |
          if [ -z "$FEISHU_WEBHOOK" ]; then
            echo "未配置 FEISHU_WEBHOOK，跳过通知"
            exit 0
          fi
          curl -s -X POST "$FEISHU_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d '{
              "msg_type": "text",
              "content": {
                "text": "❌ xishu-reading 部署失败\n分支: ${{ github.ref_name }}\n提交: ${{ github.sha }}\n详情: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
              }
            }'
