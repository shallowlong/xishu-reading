name: 部署「奚叔阅读」到阿里云

# 推送 main 或手动触发：构建 Hexo，再用 FTP 镜像同步到 reading.xishu2099.top
#
# 需要在仓库 Settings → Secrets and variables → Actions 配置：
#   FTP_SERVER     必填，FTP 主机
#   FTP_USERNAME   必填，FTP 账号
#   FTP_PASSWORD   必填，FTP 密码
#   FTP_SERVER_DIR 选填，FTP 登录后的站点目录；默认 . 表示登录目录
#                  （宝塔/虚拟主机的 FTP 账号通常已 chroot 到站点根目录；
#                   若登录后不是站点根，再设为 /www/wwwroot/reading.xishu2099.top）
#   FEISHU_WEBHOOK 选填，飞书机器人 webhook，不填则跳过通知
#
# 服务器上由宝塔生成的 .well-known / .htaccess / .user.ini / 404.html
# 不参与同步，避免被 --delete 清掉。

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v6

      - name: 设置 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "npm"

      - name: 安装依赖
        run: npm ci

      - name: 生成静态文件
        run: npm run build
        env:
          HEXO_ENV: production

      - name: 安装 lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: FTP 镜像同步到阿里云
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR || '.' }}
        run: |
          missing=""
          if [ -z "$FTP_SERVER" ]; then missing="$missing FTP_SERVER"; fi
          if [ -z "$FTP_USERNAME" ]; then missing="$missing FTP_USERNAME"; fi
          if [ -z "$FTP_PASSWORD" ]; then missing="$missing FTP_PASSWORD"; fi
          if [ -n "$missing" ]; then
            echo "缺少必填 Secrets:$missing"
            echo "请在仓库 Settings → Secrets and variables → Actions 中配置"
            exit 1
          fi

          cat > "$RUNNER_TEMP/deploy.lftp" <<EOF
          set cmd:fail-exit yes
          set ftp:ssl-allow no
          set net:timeout 30
          set net:max-retries 3
          open -u "$FTP_USERNAME","$FTP_PASSWORD" "ftp://$FTP_SERVER"
          cd "$FTP_SERVER_DIR"
          mirror -R --delete --parallel=4 --verbose -x '\.well-known' -x '\.htaccess' -x '\.user\.ini' -x '404\.html' ./public/ .
          bye
          EOF

          lftp -f "$RUNNER_TEMP/deploy.lftp"

      - name: 发送飞书通知（成功）
        if: success()
        continue-on-error: true
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        run: |
          if [ -z "$FEISHU_WEBHOOK" ]; then
            echo "未配置 FEISHU_WEBHOOK，跳过通知"
            exit 0
          fi
          curl -s -X POST "$FEISHU_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d '{
              "msg_type": "text",
              "content": {
                "text": "✅ xishu-reading 部署成功\n分支: ${{ github.ref_name }}\n提交: ${{ github.sha }}\n站点: https://reading.xishu2099.top"
              }
            }'

      - name: 发送飞书通知（失败）
        if: failure()
        continue-on-error: true
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        run: |
          if [ -z "$FEISHU_WEBHOOK" ]; then
            echo "未配置 FEISHU_WEBHOOK，跳过通知"
            exit 0
          fi
          curl -s -X POST "$FEISHU_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d '{
              "msg_type": "text",
              "content": {
                "text": "❌ xishu-reading 部署失败\n分支: ${{ github.ref_name }}\n提交: ${{ github.sha }}\n详情: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
              }
            }'
